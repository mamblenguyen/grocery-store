name: CI/CD

# - Pull request: test → deploy preview Web (dùng API production) → comment link vào PR
# - Push lên main: test → migrate DB production → deploy production (API + Web) → smoke test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  NODE_VERSION: '22'
  VERCEL_CLI: vercel@65.11.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  # ───────────────────────────── 1. TEST ─────────────────────────────
  test:
    name: Test (build + migrate + smoke)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: grocery
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/grocery
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/grocery_shadow
      JWT_SECRET: ci-secret
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend – install
        working-directory: backend
        run: npm ci

      - name: Backend – kiểm tra migration khớp schema.prisma
        working-directory: backend
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code \
          || { echo "::error::schema.prisma thay đổi nhưng chưa tạo migration. Chạy: npx prisma migrate dev --name <ten>"; exit 1; }

      - name: Backend – migrate + seed + build
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npx prisma db seed
          npm run build

      - name: Backend – chạy API & smoke test đầy đủ
        working-directory: backend
        run: |
          node dist/main.js > api.log 2>&1 &
          ../scripts/smoke-test.sh http://localhost:4000 --full || { cat api.log; exit 1; }

      - name: Frontend – install & build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
        run: |
          npm ci
          npm run build

  # ─────────────────── Kiểm tra đã cấu hình secrets chưa ───────────────────
  config:
    name: Kiểm tra cấu hình deploy
    runs-on: ubuntu-latest
    outputs:
      vercel: ${{ steps.check.outputs.vercel }}
    steps:
      - id: check
        env:
          HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID_API != '' && secrets.VERCEL_PROJECT_ID_WEB != '' }}
        run: |
          echo "vercel=$HAS_VERCEL" >> "$GITHUB_OUTPUT"
          [ "$HAS_VERCEL" = "true" ] || echo "::warning::Chưa cấu hình secrets Vercel → bỏ qua deploy. Xem DEPLOY.md (chạy scripts/vercel-setup.sh)."

  # ───────────────────────── 2. DEPLOY PRODUCTION ─────────────────────────
  deploy-production:
    name: Deploy production
    needs: [test, config]
    if: needs.config.outputs.vercel == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm i -g ${{ env.VERCEL_CLI }}
      - name: Kiểm tra biến API_URL
        run: '[ -n "$API_URL" ] || { echo "::error::Thiếu GitHub variable API_URL (vd https://grocery-store-api.vercel.app)"; exit 1; }'

      # ── API (NestJS) ──
      - name: API – lấy cấu hình & env từ Vercel
        working-directory: backend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: API – migrate database production
        working-directory: backend
        env:
          # Tuỳ chọn: ghi đè bằng GitHub secret nếu biến trên Vercel là "Sensitive" (không pull được)
          OVERRIDE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -a; . .vercel/.env.production.local; set +a
          export DATABASE_URL="${OVERRIDE_DATABASE_URL:-${DATABASE_URL:-}}"
          [ -n "$DATABASE_URL" ] || { echo "::error::Project API trên Vercel chưa có DATABASE_URL. Thêm biến DATABASE_URL (MySQL) vào project. Xem DEPLOY.md"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          npm ci
          npx prisma migrate deploy
          npx prisma db seed   # chỉ seed khi DB trống

      - name: API – build & deploy
        id: api
        working-directory: backend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "API deployment: $url"

      - name: API – smoke test
        run: scripts/smoke-test.sh "$API_URL"

      # ── Web (Next.js) ──
      - name: Web – lấy cấu hình từ Vercel
        working-directory: frontend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          # NEXT_PUBLIC_* được nhúng lúc build → đảm bảo trỏ đúng domain API production
          f=.vercel/.env.production.local
          sed -i '/^NEXT_PUBLIC_API_URL=/d' "$f"
          echo "NEXT_PUBLIC_API_URL=\"${API_URL%/}/api\"" >> "$f"

      - name: Web – build & deploy
        id: web
        working-directory: frontend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}/api
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Tóm tắt
        run: |
          {
            echo "## 🚀 Đã deploy production"
            echo "| | URL |"
            echo "|---|---|"
            echo "| Cửa hàng | ${{ vars.WEB_URL || steps.web.outputs.url }} |"
            echo "| Quản trị | ${{ vars.WEB_URL || steps.web.outputs.url }}/admin |"
            echo "| API | $API_URL/api/health |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────── 3. DEPLOY PREVIEW (PR) ─────────────────────────
  deploy-preview:
    name: Deploy preview
    needs: [test, config]
    # PR từ fork không có quyền đọc secrets → bỏ qua
    if: >-
      needs.config.outputs.vercel == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.web.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm i -g ${{ env.VERCEL_CLI }}

      - name: Web – build & deploy preview
        id: web
        working-directory: frontend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          API_BASE: ${{ vars.API_URL }}
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          f=.vercel/.env.preview.local
          sed -i '/^NEXT_PUBLIC_API_URL=/d' "$f"
          echo "NEXT_PUBLIC_API_URL=\"${API_BASE%/}/api\"" >> "$f"
          NEXT_PUBLIC_API_URL="${API_BASE%/}/api" vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment link preview vào PR
        uses: actions/github-script@v7
        env:
          WEB: ${{ steps.web.outputs.url }}
          API: ${{ vars.API_URL }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = [
              marker,
              '### 🔍 Preview deployment',
              '| | URL |', '|---|---|',
              `| Cửa hàng | ${process.env.WEB} |`,
              `| Quản trị | ${process.env.WEB}/admin |`,
              `| API | ${process.env.API}/api/health |`,
              '', `_Commit ${context.sha.slice(0, 7)}_`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const old = comments.find((c) => c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
